<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Downloader</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Video Downloader</h1>
  <p class="muted">YouTube и другие сайты, которые поддерживает yt-dlp.</p>
  <div class="row"><input id="url" placeholder="Вставьте ссылку на видео"><button id="go">Найти видео</button></div>
  <section id="card" class="hidden">
    <img id="thumb"><div class="info"><h2 id="title"></h2><p id="stage"></p>
    <div class="bar"><i id="bar"></i></div><div id="formats"></div><a id="download" class="button hidden">Скачать готовый файл</a>
    <pre id="error"></pre></div>
  </section>
</main><script src="/static/app.js"></script>
</body></html>
