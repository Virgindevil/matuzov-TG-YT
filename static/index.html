<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Downloader</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <header>
            <div class="logo">VD</div>
            <div><h1>Video Downloader</h1><p>Прямые ссылки на видео из YouTube и X</p></div>
        </header>
        <form id="search" class="search">
            <input id="url" type="url" required aria-label="Ссылка на видео" placeholder="Вставьте ссылку на видео…">
            <button id="find">Найти</button>
        </form>
        <div id="msg" role="status"></div>
        <section id="card" class="card hidden">
            <div class="meta">
                <span id="source"></span>
                <h2 id="title"></h2>
                <div id="qualities"></div>
                <p>Если MP4 открылся в новой вкладке, сохраните его через меню плеера или браузера.</p>
            </div>
        </section>
        <footer>Файлы загружаются с CDN источника. Для более высоких разрешений с отдельными дорожками используйте Windows-приложение.</footer>
    </main>
    <script src="/app.js?v=direct"></script>
</body>
</html>
